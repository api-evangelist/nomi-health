aid: nomi-health
name: Nomi Health
description: 'Nomi Health is a Utah-based direct healthcare and healthcare fintech company
  founded in 2019 that operates a payments, claims and analytics platform for self-funded
  employers, health plans, brokers and providers. Its stack spans real-time provider
  payments and claims adjudication (Healthcare Financial Services), directly contracted
  provider networks (Direct Network / Open Network), benefits-data analytics through
  Artemis by Nomi Health, and direct patient care services. Nomi Health operates authenticated
  web portals for providers, members and employers, but publishes no public developer
  program, API reference, or machine-readable specification.'
